name: Nonplanar native Linux evidence
on:
  workflow_dispatch:
  push:
    branches: [feature/nonplanar-bootstrap]
    paths:
      - '.github/workflows/nonplanar-native.yml'
      - 'src/libslic3r/**'
      - 'deps_src/admesh/**'
      - 'src/nonplanar_verify/**'
      - 'src/nonplanar_import/**'
      - 'tests/nonplanar/**'
      - 'tests/fff_print/**'
      - 'scripts/nonplanar/**'
      - 'deps/**'
      - 'cmake/**'
      - 'scripts/linux.d/**'
      - 'build_linux.sh'
      - 'CMakeLists.txt'
      - 'version.inc'
      - 'docs/nonplanar/upstream/orca.lock.json'
permissions:
  contents: read
concurrency:
  group: nonplanar-native-${{ github.ref }}
  # Finish costly dependency builds so every completed run retains evidence.
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pinned source and normative package
        run: |
          mkdir -p build/nonplanar-evidence/linux
          uname -a > build/nonplanar-evidence/linux/platform.txt
          python3 scripts/nonplanar/run_logged.py --output build/nonplanar-evidence/linux/source-audit.log -- python3 docs/nonplanar/scripts/audit_orca_checkout.py --repo .
          python3 scripts/nonplanar/run_logged.py --output build/nonplanar-evidence/linux/package.log -- python3 docs/nonplanar/scripts/validate_package.py
          python3 scripts/nonplanar/run_logged.py --output build/nonplanar-evidence/linux/gmp-contract.log -- python3 scripts/nonplanar/test_gmp_build_contract.py
      - name: System dependencies on disposable runner
        run: sudo ./build_linux.sh -ur
      - name: Identify exact dependency source and runner environment
        id: deps_identity
        run: python3 scripts/nonplanar/deps_cache_key.py --output build/nonplanar-evidence/linux/deps-cache-inputs.json --github-output "$GITHUB_OUTPUT"
      - name: Restore exact installed dependencies
        id: deps_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: deps/build/OrcaSlicer_dep
          key: ${{ steps.deps_identity.outputs.key }}
      - name: Build pinned dependency sources
        if: steps.deps_cache.outputs.cache-hit != 'true'
        run: python3 scripts/nonplanar/run_logged.py --output build/nonplanar-evidence/linux/deps.log -- ./build_linux.sh -drlL -j 2
      # Save after dependency success, even if the later native test gate fails.
      - name: Preserve completed dependency installation
        if: steps.deps_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: deps/build/OrcaSlicer_dep
          key: ${{ steps.deps_identity.outputs.key }}
      - name: Record dependency reuse separately from a fresh build
        env:
          DEPENDENCIES_CACHE_HIT: ${{ steps.deps_cache.outputs.cache-hit }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          state = 'RESTORED_EXACT_CACHE' if os.environ['DEPENDENCIES_CACHE_HIT'] == 'true' else 'BUILT_THIS_RUN'
          Path('build/nonplanar-evidence/linux/deps-origin.json').write_text(json.dumps({'status': state}) + '\n')
          PY
      # Retain test diagnostics before spending the remaining time on GUI and
      # packaging. The pinned script supports tests-only with the same config.
      - name: Build native tests before the application
        run: python3 scripts/nonplanar/run_logged.py --output build/nonplanar-evidence/linux/test-build.log -- ./build_linux.sh -trlL -j 2
      - name: Execute nonempty selected native suites
        id: native_tests
        run: |
          clang++ --version > build/nonplanar-evidence/linux/compiler.txt
          python3 scripts/nonplanar/run_logged.py --output build/nonplanar-evidence/linux/tests.log -- python3 scripts/nonplanar/ctest_gate.py --build-dir build --output-dir build/nonplanar-evidence/linux/ctest --target-executable nonplanar_tests --target-executable fff_print_tests
      - name: Expose native failure diagnostics in check annotations
        if: failure() && steps.native_tests.outcome == 'failure'
        run: python3 scripts/nonplanar/publish_ci_failure.py --evidence-dir build/nonplanar-evidence/linux
      - name: Exercise native STL audit command
        run: python3 scripts/nonplanar/run_logged.py --output build/nonplanar-evidence/linux/stl-cli.log -- python3 scripts/nonplanar/validate_stl_audit_cli.py --executable build/src/nonplanar_import/Release/nonplanar_stl_audit --output-dir build/nonplanar-evidence/linux/stl-cli
      - name: Exercise independent native final-byte rate audit
        run: python3 scripts/nonplanar/run_logged.py --output build/nonplanar-evidence/linux/rate-cli.log -- python3 scripts/nonplanar/validate_rate_audit_cli.py --executable build/src/nonplanar_verify/Release/nonplanar_rate_audit --output-dir build/nonplanar-evidence/linux/rate-cli
      - name: Exercise independent final-byte material reconstruction
        run: python3 scripts/nonplanar/run_logged.py --output build/nonplanar-evidence/linux/material-cli.log -- python3 scripts/nonplanar/validate_material_audit_cli.py --executable build/src/nonplanar_verify/Release/nonplanar_rate_audit --output-dir build/nonplanar-evidence/linux/material-cli
      - name: Exercise independent actual-prefix material region coverage
        run: python3 scripts/nonplanar/run_logged.py --output build/nonplanar-evidence/linux/material-cover-cli.log -- python3 scripts/nonplanar/validate_material_cover_cli.py --executable build/src/nonplanar_verify/Release/nonplanar_rate_audit --fixture-dir build/nonplanar-evidence/linux/material-cli/positive --output-dir build/nonplanar-evidence/linux/material-cover-cli
      - name: Exercise independent actual-prefix joined lower envelope
        run: python3 scripts/nonplanar/run_logged.py --output build/nonplanar-evidence/linux/material-joined-cli.log -- python3 scripts/nonplanar/validate_joined_material_cli.py --executable build/src/nonplanar_verify/Release/nonplanar_rate_audit --fixture-dir build/nonplanar-evidence/linux/material-cli/positive --output-dir build/nonplanar-evidence/linux/material-joined-cli
      - name: Exercise independent complete-run support and actual gap bands
        run: python3 scripts/nonplanar/run_logged.py --output build/nonplanar-evidence/linux/run-support-cli.log -- python3 scripts/nonplanar/validate_run_support_cli.py --executable build/src/nonplanar_verify/Release/nonplanar_rate_audit --fixture-dir build/nonplanar-evidence/linux/material-cli/positive --output-dir build/nonplanar-evidence/linux/run-support-cli
      - name: Build native application after test verification
        run: python3 scripts/nonplanar/run_logged.py --output build/nonplanar-evidence/linux/app-build.log -- ./build_linux.sh -srlL -j 2
      - name: Preserve observed results even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nonplanar-linux-${{ github.sha }}
          path: |
            build/nonplanar-evidence/linux/
            build/CMakeCache.txt
          if-no-files-found: error
